[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easy-tdx"
version = "1.20.10"
description = "通达信 TCP 协议行情数据客户端，支持在线行情、离线数据读取与写入同步"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "click>=8.0,<9",
    "pandas>=2.0,<3",
    "tzdata>=2024.1",
]

[project.scripts]
easy-tdx = "easy_tdx.cli:cli"

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "ruff>=0.4",
    "scipy>=1.10,<1.16",
]
packaging = ["pillow>=10.0", "pystray>=0.19"]
science = ["scipy>=1.10,<1.16"]
web = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.29"]

[tool.hatch.build.targets.wheel]
packages = ["src/easy_tdx"]

[tool.hatch.build.targets.sdist]
include = ["src/easy_tdx", "LICENSE", "NOTICE", "README.md"]
